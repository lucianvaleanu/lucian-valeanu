name: SonarCloud

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check (optional but useful)
        run: npm run build --if-present

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        with:
          projectKey: lucianvaleanu
          organization: Lucian-George Văleanu
          token: ${{ secrets.SONAR_TOKEN }}
