name: SonarCloud

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check (optional)
        run: npm run build --if-present

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          args: >
            -Dsonar.projectKey=lucianvaleanu_lucian-valeanu
            -Dsonar.organization=lucianvaleanu
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
